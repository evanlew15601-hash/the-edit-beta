<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="A prestige TV-inspired reality show simulator where every conversation shapes your edit."
    />

    <meta property="og:title" content="The Edit – Reality TV Strategy Simulator" />

      property="og:description"
      content="Play through a season where alliances, gossip, and confessionals decide your story."

    <meta name="twitter:card" content="summary_large_image" />

    <style>
      html, body, #root { background: #0e1014; color: #f2f2f2; min-height: 100%; }
      body { margin: 0; font-family: Georgia, serif; }
    </style>
  </head>
  <body>
    <div id="root">Loading The Edit…</div>
    <script>
      window.addEventListener('error', function (e) {
        var root = document.getElementById('root');
        if (root && root.textContent.indexOf('Loading') === 0) {
          root.textContent = 'The Edit failed to start: ' + (e.message || 'unknown error');
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
